name: Restore conformance oracle
description: Restore the same-attempt mc-module lib test binary without running Cargo in Bun shards
runs:
  using: composite
  steps:
    - uses: ./.github/actions/wait-ci-artifact
      id: oracle
      with:
        artifact: conformance-oracle-${{ github.sha }}
        producer: Rust (mc-module lib archive)
        timeout-minutes: "45"
    - uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ steps.oracle.outputs.artifact-id }}
        merge-multiple: true
        path: ci-conformance-oracle
    - name: Verify and expose the oracle binary
      shell: bash
      run: |
        set -euo pipefail
        test "$(cat ci-conformance-oracle/commit.txt)" = "$GITHUB_SHA"
        sha256sum --check ci-conformance-oracle/oracle.sha256
        binary="$GITHUB_WORKSPACE/ci-conformance-oracle/mc-module-lib-test"
        chmod +x "$binary"
        test -x "$binary"
        echo "MC_CONFORMANCE_ORACLE_BINARY=$binary" >> "$GITHUB_ENV"
        printf 'Prebuilt conformance oracle: %s\n' "$binary"
